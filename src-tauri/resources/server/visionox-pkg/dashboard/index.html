    <script>
      (function() {
        try {
          // Priority: URL param (set by Tauri / restoreDashboard) → cookie → localStorage → dark
          var t = '';
          var um = window.location.search.match(/[?&]theme=([^&]+)/);
          if (um) t = decodeURIComponent(um[1]);
          if (!t) {
            var cm = document.cookie.match(/(?:^|;\s*)visionox-theme=([^;]*)/);
            if (cm) t = decodeURIComponent(cm[1]);
          }
          if (!t) t = localStorage.getItem('visionox-theme') || '';
          if (!/^(light|dark|warm-sand|cool-ash|soft-sage|espresso|midnight-ink|deep-charcoal)$/.test(t)) t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>

      <div class="boot">loading…</div>

    <script>
      var sectionState = { '\u76D1\u63A7': true, '\u914D\u7F6E': true };
      function setupSectionToggles() {
        var sections = document.querySelectorAll('.side-section');
        sections.forEach(function(sec) {
          var label = sec.textContent.trim();
          if (sectionState.hasOwnProperty(label) && !sec._toggled) {
            sec._toggled = true;
            sec.style.cursor = 'pointer';
            var tabs = [];
            var el = sec.nextElementSibling;
            while (el && !el.classList.contains('side-section')) {
              if (el.classList.contains('side-tab')) tabs.push(el);
              el = el.nextElementSibling;
            }
            tabs.forEach(function(t) { t.style.display = 'none'; });
            sec.textContent = '\u25B6 ' + label;
            sec.addEventListener('click', function() {
              var collapsed = sectionState[label];
              sectionState[label] = !collapsed;
              tabs.forEach(function(t) { t.style.display = !collapsed ? '' : 'none'; });
              sec.textContent = (!collapsed ? '\u25BC ' : '\u25B6 ') + label;
            });
          }
        });
      }
      var mo = new MutationObserver(function() { setupSectionToggles(); });
      mo.observe(document.getElementById('root'), { childList: true, subtree: true });
      setTimeout(setupSectionToggles, 500);
      setTimeout(setupSectionToggles, 1500);
    </script>
