<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visionox</title>
    <meta name="reasonix-token" content="__REASONIX_TOKEN__" />
    <meta name="reasonix-mode" content="__REASONIX_MODE__" />
    <link rel="stylesheet" href="/assets/app.css?token=__REASONIX_TOKEN__" />
    <link rel="stylesheet" href="/assets/vendor-uplot.css?token=__REASONIX_TOKEN__" />
    <link rel="stylesheet" href="/assets/vendor-hljs.css?token=__REASONIX_TOKEN__" />
  
    <style>
      .app-side .brand .glyph { display: inline-block; width: 32px; height: 52px; background: url(/assets/v3.png) no-repeat center/contain; font-size: 0; }
    </style></head>
  <body>
    <script>
      (function() {
        try {
          var m = document.cookie.match(/(?:^|;\s*)visionox-theme=([^;]*)/);
          var t = m ? m[1] : '';
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <div id="root">
      <div class="boot">loading…</div>
    </div>
    <script type="module" src="/assets/app.js?token=__REASONIX_TOKEN__"></script>
  
    <script>
      var monitorCollapsed = true;
      function setupMonitorToggle() {
        var sections = document.querySelectorAll('.side-section');
        sections.forEach(function(sec) {
          if (sec.textContent.trim() === '\u76D1\u63A7' && !sec._monitorWired) {
            sec._monitorWired = true;
            sec.style.cursor = 'pointer';
            var tabs = [];
            var el = sec.nextElementSibling;
            while (el && !el.classList.contains('side-section')) {
              if (el.classList.contains('side-tab')) tabs.push(el);
              el = el.nextElementSibling;
            }
            tabs.forEach(function(t) { t.style.display = 'none'; });
            sec.innerHTML = '\u25B6 \u76D1\u63A7';
            sec.addEventListener('click', function() {
              monitorCollapsed = !monitorCollapsed;
              tabs.forEach(function(t) { t.style.display = monitorCollapsed ? 'none' : ''; });
              sec.innerHTML = monitorCollapsed ? '\u25B6 \u76D1\u63A7' : '\u25BC \u76D1\u63A7';
            });
          }
        });
      }
      var mo = new MutationObserver(function() { setupMonitorToggle(); });
      mo.observe(document.getElementById('root'), { childList: true, subtree: true });
      setTimeout(setupMonitorToggle, 500);
      setTimeout(setupMonitorToggle, 1500);
    </script>
</body>
</html>
