    <style>
      .preloader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        background: #f3f4f6;
        z-index: 1000;
        transition: opacity .3s ease;
        font-family: 'JetBrains Mono', monospace;
      }
      .preloader.hide { opacity: 0; pointer-events: none; }
      .preloader-cube {
        width: 32px; height: 32px;
        border: 2px solid #1a6fd4;
        border-radius: 4px;
        animation: cube-spin 2s ease-in-out infinite;
        position: relative;
      }
      .preloader-cube::after {
        content: "";
        position: absolute; inset: 4px;
        border: 1px solid #723aed;
        border-radius: 2px;
        animation: cube-spin 1.5s ease-in-out infinite reverse;
      }
      @keyframes cube-spin {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(90deg); }
        50% { transform: rotate(180deg); }
        75% { transform: rotate(270deg); }
      }
      .preloader-text {
        color: #5c6370;
        font-size: 12px;
        letter-spacing: .12em;
        text-transform: uppercase;
        animation: preloader-pulse 2s ease-in-out infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: .4; }
        50% { opacity: 1; }
      }
      .side-tab .g svg {
        width: 15px; height: 15px;
        display: block;
        flex-shrink: 0;
      }
    </style>

          setTimeout(() => preloader.remove(), 350);
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true, attributes: true });
      setTimeout(() => {
        preloader.classList.add("hide");
        setTimeout(() => { if (preloader.parentNode) preloader.remove(); }, 350);

      function replaceGlyphs() {
        var brandGlyph = document.querySelector('.app-side .brand .glyph');
        if (brandGlyph && !brandGlyph.querySelector('img')) {
          brandGlyph.innerHTML = BRAND_ICON;
        }
        document.querySelectorAll('.side-tab').forEach(function(tab) {
          var span = tab.querySelector('.g');
          if (!span || span.querySelector('svg')) return;
          var label = (tab.querySelector('.label') || {}).textContent || '';
          label = label.trim();
          for (var key in EXPECTED_LABELS) {
            if (EXPECTED_LABELS.hasOwnProperty(key) && label === EXPECTED_LABELS[key] && TAB_ICONS[key]) {
              span.innerHTML = TAB_ICONS[key];
              break;
            }
          }
        });
      }

      // ── Monitoring section collapse/expand ──────────────────────
      var monitorCollapsed = true;

      function setupMonitorToggle() {
        var sections = document.querySelectorAll('.side-section');
        sections.forEach(function(sec) {
          if (sec.textContent.trim() === '监控' && !sec._monitorWired) {
            sec._monitorWired = true;
            sec.style.cursor = 'pointer';
            sec.classList.add('monitor-toggle');
            // Find following tabs until next section
            var tabs = [];
            var el = sec.nextElementSibling;
            while (el && !el.classList.contains('side-section')) {
              if (el.classList.contains('side-tab')) tabs.push(el);
              el = el.nextElementSibling;
            }
            // Hide tabs initially
            tabs.forEach(function(t) { t.style.display = 'none'; });
            sec._monitorTabs = tabs;
            // Add expand indicator
            sec.innerHTML = '▶ 监控';
            sec.addEventListener('click', function() {
              monitorCollapsed = !monitorCollapsed;
              tabs.forEach(function(t) {
                t.style.display = monitorCollapsed ? 'none' : '';
              });
              sec.innerHTML = monitorCollapsed ? '▶ 监控' : '▼ 监控';
            });
          }
        });
      }

      function scheduleGlyphReplace() {
        var rootEl = document.getElementById('root');
        var mo = new MutationObserver(function() {
          replaceGlyphs();
          setupMonitorToggle();
        });
        mo.observe(rootEl, { childList: true, subtree: true });
        replaceGlyphs();
        setupMonitorToggle();
        setTimeout(replaceGlyphs, 500);
        setTimeout(setupMonitorToggle, 500);
        setTimeout(replaceGlyphs, 1500);
        setTimeout(setupMonitorToggle, 1500);
        setTimeout(replaceGlyphs, 3000);
        setTimeout(setupMonitorToggle, 3000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scheduleGlyphReplace);
      } else {
        scheduleGlyphReplace();
      }
    </script>
