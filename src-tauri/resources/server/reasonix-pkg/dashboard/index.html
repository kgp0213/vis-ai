<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reasonix — AI Coding Agent</title>
    <meta name="reasonix-token" content="__REASONIX_TOKEN__" />
    <meta name="reasonix-mode" content="__REASONIX_MODE__" />
    <meta name="theme-color" content="#f3f4f6" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="/assets/app.css?token=__REASONIX_TOKEN__" />
    <link rel="stylesheet" href="/assets/vendor-uplot.css?token=__REASONIX_TOKEN__" />
    <link rel="stylesheet" href="/assets/vendor-hljs.css?token=__REASONIX_TOKEN__" />
    <style>
      .preloader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        background: #f3f4f6;
        z-index: 1000;
        transition: opacity .3s ease;
        font-family: 'JetBrains Mono', monospace;
      }
      .preloader.hide { opacity: 0; pointer-events: none; }
      .preloader-cube {
        width: 32px; height: 32px;
        border: 2px solid #1a6fd4;
        border-radius: 4px;
        animation: cube-spin 2s ease-in-out infinite;
        position: relative;
      }
      .preloader-cube::after {
        content: "";
        position: absolute; inset: 4px;
        border: 1px solid #723aed;
        border-radius: 2px;
        animation: cube-spin 1.5s ease-in-out infinite reverse;
      }
      @keyframes cube-spin {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(90deg); }
        50% { transform: rotate(180deg); }
        75% { transform: rotate(270deg); }
      }
      .preloader-text {
        color: #5c6370;
        font-size: 12px;
        letter-spacing: .12em;
        text-transform: uppercase;
        animation: preloader-pulse 2s ease-in-out infinite;
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: .4; }
        50% { opacity: 1; }
      }
      .side-tab .g svg {
        width: 15px; height: 15px;
        display: block;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="preloader" id="preloader">
      <div class="preloader-cube"></div>
      <span class="preloader-text">Reasonix</span>
    </div>
    <div id="root">
      <div class="boot">loading…</div>
    </div>
    <script>
      const preloader = document.getElementById("preloader");
      const root = document.getElementById("root");
      const observer = new MutationObserver(() => {
        if (root.children.length > 1 || (root.children[0] && root.children[0].classList && !root.children[0].classList.contains("boot"))) {
          preloader.classList.add("hide");
          setTimeout(() => preloader.remove(), 350);
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true, attributes: true });
      setTimeout(() => {
        preloader.classList.add("hide");
        setTimeout(() => { if (preloader.parentNode) preloader.remove(); }, 350);
      }, 5000);
    </script>
    <script type="module" src="/assets/app.js?token=__REASONIX_TOKEN__"></script>
    <script>
      var TAB_ICONS = {
        chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
        plans: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
        sessions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
        overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>',
        usage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>',
        health: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
        semantic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
        tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
        permissions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
        mcp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
        skills: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
        memory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
        hooks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
      };
      var BRAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polygon points="12 2 22 8.5 17 12 22 15.5 12 22 2 15.5 7 12 2 8.5 12 2"/></svg>';

      var EXPECTED_LABELS = {
        chat: 'Chat', plans: 'Plans', sessions: 'Sessions',
        overview: 'Overview', usage: 'Usage', health: 'System',
        semantic: 'Semantic', tools: 'Tools', permissions: 'Permissions',
        mcp: 'MCP', skills: 'Skills', memory: 'Memory',
        hooks: 'Hooks', settings: 'Settings',
      };

      function replaceGlyphs() {
        var brandGlyph = document.querySelector('.app-side .brand .glyph');
        if (brandGlyph && !brandGlyph.querySelector('svg')) {
          brandGlyph.innerHTML = BRAND_ICON;
        }
        document.querySelectorAll('.side-tab').forEach(function(tab) {
          var span = tab.querySelector('.g');
          if (!span || span.querySelector('svg')) return;
          var label = (tab.querySelector('.label') || {}).textContent || '';
          label = label.trim();
          for (var key in EXPECTED_LABELS) {
            if (EXPECTED_LABELS.hasOwnProperty(key) && label === EXPECTED_LABELS[key] && TAB_ICONS[key]) {
              span.innerHTML = TAB_ICONS[key];
              break;
            }
          }
        });
      }

      function scheduleGlyphReplace() {
        var rootEl = document.getElementById('root');
        var mo = new MutationObserver(function() { replaceGlyphs(); });
        mo.observe(rootEl, { childList: true, subtree: true });
        replaceGlyphs();
        setTimeout(replaceGlyphs, 500);
        setTimeout(replaceGlyphs, 1500);
        setTimeout(replaceGlyphs, 3000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', scheduleGlyphReplace);
      } else {
        scheduleGlyphReplace();
      }
    </script>
  </body>
</html>
