[package]
name = "visionox-desktop"
version = "1.20.0"
edition = "2021"
description = "Visionox AI Coding Agent — Desktop GUI"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
url = "2"

# Platform-specific dependencies.
# windows-sys is Windows-only (JobObject process groups, clipboard HDROP,
# WaitForSingleObject). nix provides the Linux equivalents (setsid,
# PR_SET_PDEATHSIG, waitpid) for child-process lifecycle management.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }


[build-dependencies]
tauri-build = { version = "2", features = [] }
