<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visionox</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
        background: #f3f4f6;
        color: #2a2f3b;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 20px;
        -webkit-font-smoothing: antialiased;
      }
      .loader {
        width: 36px; height: 36px;
        border: 3px solid #1a6fd4;
        border-radius: 6px;
        animation: spin 2s ease-in-out infinite;
        position: relative;
      }
      .loader::after {
        content: "";
        position: absolute; inset: 5px;
        border: 2px solid #723aed;
        border-radius: 4px;
        animation: spin 1.5s ease-in-out infinite reverse;
      }
      @keyframes spin {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(90deg); }
        50% { transform: rotate(180deg); }
        75% { transform: rotate(270deg); }
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #5c6370;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: .4; }
        50% { opacity: 1; }
      }
      .status {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: #8b909c;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <h1>Visionox</h1>
    <div class="status" id="status">Starting server…</div>
    <script>
      // Listen for the URL from Tauri backend
      window.addEventListener('message', (e) => {
        if (e.data && e.data.url) {
          document.getElementById('status').textContent = 'Loading dashboard…';
          window.location.href = e.data.url;
        }
      });
    </script>
  </body>
</html>
