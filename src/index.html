<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Visionox-Whale</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("visionox-theme") || "light";
          if (!/^(light|dark|warm-sand|cool-ash|soft-sage|espresso|midnight-ink|deep-charcoal|indigo-night)$/.test(theme)) theme = "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --startup-accent-hover: #125a90;
        --startup-accent-active: #0f4d7a;
        --startup-focus: #1769aa;
        --startup-disabled: #aab2bd;
        --startup-bg: #f4f6f8;
        --startup-fg: #18202a;
        --startup-muted: #667085;
        --startup-track: #d8dee6;
        --startup-accent: #1769aa;
        --startup-button-hover: #e4e9ee;
        --startup-border: #c7d0dc;
        --startup-danger: #c0362c;
      }

      :root[data-theme="dark"] {
        --startup-accent-hover: #89bdee;
        --startup-accent-active: #9cc6f2;
        --startup-focus: #6aa8e8;
        --startup-disabled: #5b6168;
        --startup-bg: #17191c;
        --startup-fg: #f1f3f5;
        --startup-muted: #a7adb5;
        --startup-track: #343940;
        --startup-accent: #6aa8e8;
        --startup-button-hover: #2a3036;

        --startup-danger: #ff8178;
      }

      :root[data-theme="warm-sand"] {
        --startup-accent-hover: #1c5b55;
        --startup-accent-active: #16443f;
        --startup-focus: #24726b;
        --startup-disabled: #b3a99b;
        --startup-bg: #f3efe7;
        --startup-fg: #292621;
        --startup-muted: #716b62;
        --startup-track: #d8d0c3;
        --startup-accent: #24726b;
        --startup-button-hover: #ebe5da;
        --startup-border: #cbc1b1;
        --startup-danger: #b53a31;
      }

      :root[data-theme="cool-ash"] {
        --startup-accent-hover: #225673;
        --startup-accent-active: #1a445c;
        --startup-focus: #2e6f95;
        --startup-disabled: #9aa4ac;
        --startup-bg: #edf0f2;
        --startup-fg: #20262b;

      }

      :root[data-theme="espresso"] {
        --startup-accent-hover: #8cbcb3;
        --startup-accent-active: #a3c9c2;
        --startup-focus: #70aaa1;
        --startup-disabled: #6b625b;
        --startup-bg: #211e1c;
        --startup-fg: #f2eeea;
        --startup-muted: #b7aea7;
        --startup-track: #443d38;
        --startup-accent: #70aaa1;
        --startup-button-hover: #39332f;
        --startup-border: #514943;
        --startup-danger: #ff8a7f;
      }

      :root[data-theme="midnight-ink"] {
        --startup-accent-hover: #79b9e2;
        --startup-accent-active: #93c6e8;
        --startup-focus: #55a5d8;
        --startup-disabled: #566472;
        --startup-bg: #111820;
        --startup-fg: #edf3f8;
        --startup-muted: #9ba9b6;
        --startup-track: #2b3946;
        --startup-accent: #55a5d8;
        --startup-button-hover: #22303c;
        --startup-border: #344656;
        --startup-danger: #ff8178;
      }

      :root[data-theme="deep-charcoal"] {
        --startup-accent-hover: #92bbd6;
        --startup-accent-active: #a8cae0;
        --startup-focus: #72a7c7;
        --startup-disabled: #595f62;
        --startup-bg: #181a1b;
        --startup-fg: #f0f1f1;
        --startup-muted: #a5aaad;
        --startup-track: #35393b;
        --startup-accent: #72a7c7;
        --startup-button-hover: #2c3032;
        --startup-border: #41474a;
        --startup-danger: #ff8178;
      }

      :root[data-theme="indigo-night"] {
        --startup-accent-hover: #9da4fa;
        --startup-accent-active: #b3b8fb;
        --startup-focus: #818cf8;
        --startup-disabled: #565a6b;
        --startup-bg: #0c0d10;
        --startup-fg: #f0f0f2;
        --startup-muted: #a0a4ad;
        --startup-track: #2a2e38;
        --startup-accent: #818cf8;
        --startup-button-hover: #1a1d24;
        --startup-border: #3d424f;
        --startup-danger: #f87171;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        background: var(--startup-bg);
        color: var(--startup-fg);
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        /* Borderless windows render without a frame shadow on Windows; a
           subtle inset stroke keeps the splash readable on same-tone
           desktop backgrounds. */
        box-shadow: inset 0 0 0 1px var(--startup-border);
      }

      #vis-app-frame {
        transition: opacity 0.15s ease;
      }

      .wrap {
        width: min(560px, calc(100vw - 96px));
        text-align: center;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .wrap.is-visible {
        opacity: 1;
        transform: none;
      }

      .wrap.is-done {
        opacity: 0;
        transform: none;
        transition: opacity 0.18s ease;
      }

      .brand-mark {
        width: 81px;
        height: 81px;
        margin: 0 auto 31.5px;
        border-radius: 21px;
        background: var(--startup-accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .signal {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 36px;
      }

      .signal span {
        display: block;
        width: 6px;
        height: 18px;
        border-radius: 3px;
        background: var(--startup-bg);
        transform-origin: center bottom;
        animation: signal 1.15s ease-in-out infinite;
      }

      .signal span:nth-child(2) {
        height: 31.5px;
        animation-delay: 0.12s;
      }

      .signal span:nth-child(3) {
        height: 13.5px;
        animation-delay: 0.24s;
      }

      @keyframes signal {
        0%, 100% { transform: scaleY(0.45); opacity: 0.5; }
        50% { transform: scaleY(1); opacity: 1; }
      }

      h1 {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--startup-fg);
        margin: 0 0 9px;
      }

      #status {
        font-size: 24px;
        color: var(--startup-muted);
        margin: 0 0 21px;
        min-height: 36px;
        line-height: 36px;
        overflow-wrap: anywhere;
      }

      .startup-progress {
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--startup-track);
      }

      .startup-progress span {
        display: block;
        width: 8%;
        height: 100%;
        border-radius: 2px;
        background: var(--startup-accent);
        transition: width 0.3s ease;
      }

      .wrap.is-error .signal span {
        animation: none;
        background: var(--startup-danger);
      }

      .wrap.is-error .startup-progress span {
        width: 100%;
        background: var(--startup-danger);
        transition: none;
      }

      .retry {
        display: none;
        margin-top: 16px;
        font-size: 13px;
        color: var(--startup-accent);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        border-radius: 4px;
        padding: 2px 4px;
      }

      .retry:hover { color: var(--startup-accent-hover); background: var(--startup-button-hover); }
      .retry:active { color: var(--startup-accent-active); }
      .retry:focus-visible { outline: 2px solid var(--startup-focus); outline-offset: 2px; }
      .retry:disabled, .retry[aria-disabled="true"] {
        color: var(--startup-disabled);
        cursor: not-allowed;
        text-decoration: none;
      }

      .wrap.is-error .retry { display: inline-block; }

      @media (prefers-reduced-motion: reduce) {
        .signal span,
        .startup-progress span,
        .wrap,
        #vis-app-frame {
          animation: none;
          transition: none;
        }

        .signal span { opacity: 0.85; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand-mark" aria-hidden="true"><span class="signal"><span></span><span></span><span></span></span></div>
      <h1>Visionox-Whale</h1>
      <p id="status" aria-live="polite">正在启动…</p>
      <div class="startup-progress" aria-hidden="true"><span></span></div>
      <a class="retry" role="button" tabindex="0">查看日志</a>
    </div>
    <script>
      (function () {
        var dashboardReadyTimer = null;
        var dashboardUrlPollTimer = null;
        var startupStatusTimers = [];
        var currentStage = 0;

        requestAnimationFrame(function () {
          var wrap = document.querySelector(".wrap");
          if (wrap) wrap.classList.add("is-visible");
        });

        function setStartupStatus(message) {
          var status = document.getElementById("status");
          if (status && message) status.textContent = message;
        }

        // Staged progress driven by real startup milestones: 1 = waiting for
        // the local server URL from Rust, 2 = dashboard URL known and iframe
        // navigating, 3 = waiting for the dashboard ready handshake,
        // 4 = dashboard ready.
        function setStage(n, text) {
          currentStage = n;
          var fill = document.querySelector(".startup-progress span");
          var widths = { 1: "30%", 2: "60%", 3: "85%", 4: "100%" };
          if (fill) fill.style.width = widths[n] || "8%";
          if (text) {
            setStartupStatus(n >= 1 && n <= 3 ? text + " · 第 " + n + " 步 / 共 3 步" : text);
          }
        }

        function clearStartupStatusTimers() {
          startupStatusTimers.forEach(function (timer) { clearTimeout(timer); });
          startupStatusTimers = [];
        }

        function scheduleStartupStatus() {
          clearStartupStatusTimers();
          [
            [6000, "仍在准备，请稍候…"],
            [15000, "启动比平时慢，仍在继续…"],
          ].forEach(function (entry) {
            startupStatusTimers.push(setTimeout(function () {
              var frame = document.getElementById("vis-app-frame");
              var wrap = document.querySelector(".wrap");
              if ((!frame || frame.dataset.ready !== "1") && wrap && !wrap.classList.contains("is-error")) {
                setStartupStatus(entry[1]);
              }
            }, entry[0]));
          });
        }

        function getTauriInvoke() {
          var api = window.__TAURI__;
          if (!api) return null;
          if (typeof api.invoke === "function") return api.invoke.bind(api);
          if (api.core && typeof api.core.invoke === "function") return api.core.invoke.bind(api.core);
          return null;
        }

        function invokeTauriCommand(name, args, attemptsLeft) {
          attemptsLeft = attemptsLeft == null ? 50 : attemptsLeft;
          return new Promise(function (resolve, reject) {
            function tick(left) {
              var invoke = getTauriInvoke();
              if (invoke) {
                invoke(name, args || {}).then(resolve).catch(reject);
                return;
              }
              if (left <= 0) {
                reject(new Error("本地桥接未就绪"));
                return;
              }
              setTimeout(function () { tick(left - 1); }, 100);
            }
            tick(attemptsLeft);
          });
        }

        function startupLog(message) {
          if (!message) return;
          invokeTauriCommand("write_client_log", { message: String(message) }, 5).catch(function () {});
        }

        function showDiagnostics(message) {
          clearStartupStatusTimers();
          if (dashboardUrlPollTimer) {
            clearTimeout(dashboardUrlPollTimer);
            dashboardUrlPollTimer = null;
          }
          var wrap = document.querySelector(".wrap");
          if (wrap) wrap.classList.add("is-error");
          var status = document.getElementById("status");
          if (status && message) {
            status.textContent = message;
            status.style.color = "var(--startup-danger)";
          }
          startupLog("startup diagnostics shown: " + (message || ""));
        }

        window.__visionoxShowStartupFailure = function (message) {
          showDiagnostics(message || "无法连接本地服务，请查看运行日志。");
        };

        // Borderless splash stays movable: any left-button press outside
        // interactive elements starts a native window drag.
        document.body.addEventListener("mousedown", function (event) {
          if (event.button !== 0) return;
          var target = event.target;
          if (target && target.closest && target.closest("button")) return;
          invokeTauriCommand("begin_window_drag", {}, 3).catch(function () {});
        });

        var retryLink = document.querySelector(".retry");
        if (retryLink) {
          function openRetryLog() {
            invokeTauriCommand("open_log_dir", {}, 1).catch(function () {});
          }
          retryLink.addEventListener("click", function (e) {
            e.preventDefault();
            openRetryLog();
          });
          retryLink.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openRetryLog();
            }
          });
        }

        function installTauriBridge() {
          if (window.__visionoxBridgeInstalled) return;
          window.__visionoxBridgeInstalled = true;
          window.addEventListener("message", function (event) {
            if (!event.data || !["vis_get_clipboard", "vis_pick_markdown_file", "vis_pick_directory", "vis_client_log", "vis_open_log_dir"].includes(event.data.type)) return;
            var frame = document.getElementById("vis-app-frame");
            var dashboardUrl = sessionStorage.getItem("visionox.dashboardUrl") || localStorage.getItem("visionox.dashboardUrl") || "";
            var dashboardOrigin = sessionStorage.getItem("visionox.dashboardOrigin") || localStorage.getItem("visionox.dashboardOrigin") || "";
            if (!dashboardOrigin) return;
            if (!frame || event.source !== frame.contentWindow || event.origin !== dashboardOrigin) return;
            var source = event.source;
            var origin = event.origin;
            function reply(payload) {
              if (source) source.postMessage(payload, origin);
            }
            function doSimpleInvoke() {
              if (event.data.type === "vis_client_log") {
                return invokeTauriCommand("write_client_log", { message: String(event.data.message || "") }, 1);
              }
              return invokeTauriCommand("open_log_dir", {}, 1);
            }
            function doMarkdownPickerInvoke() {
              invokeTauriCommand("pick_markdown_file", {}, 1)
                .then(function (result) {
                  reply({
                    type: "vis_pick_markdown_file_result",
                    requestId: event.data.requestId || "",
                    path: result && result.path ? String(result.path) : "",
                    error: result && result.error ? String(result.error) : undefined
                  });
                })
                .catch(function (error) {
                  reply({
                    type: "vis_pick_markdown_file_result",
                    requestId: event.data.requestId || "",
                    error: String(error),
                    path: ""
                  });
                });
            }
            function doDirectoryPickerInvoke() {
              invokeTauriCommand("pick_directory", {}, 1)
                .then(function (result) {
                  reply({
                    type: "vis_pick_directory_result",
                    requestId: event.data.requestId || "",
                    path: result && result.path ? String(result.path) : "",
                    error: result && result.error ? String(result.error) : undefined
                  });
                })
                .catch(function (error) {
                  reply({ type: "vis_pick_directory_result", requestId: event.data.requestId || "", error: String(error), path: "" });
                });
            }
            function doClipboardInvoke() {
              invokeTauriCommand("get_clipboard_files", {}, 1)
                .then(function (result) {
                  var paths = (result && Array.isArray(result.paths)) ? result.paths : [];
                  reply({ type: "vis_clipboard_result", paths: paths, error: result && result.error ? String(result.error) : undefined });
                })
                .catch(function (error) {
                  reply({ type: "vis_clipboard_result", error: String(error), paths: [] });
                });
            }
            if (getTauriInvoke()) {
              if (event.data.type === "vis_pick_markdown_file") doMarkdownPickerInvoke();
              else if (event.data.type === "vis_pick_directory") doDirectoryPickerInvoke();
              else if (event.data.type === "vis_get_clipboard") doClipboardInvoke();
              else doSimpleInvoke().catch(function () {});
            } else {
              var attempts = 30;
              var timer = setInterval(function () {
                if (getTauriInvoke()) {
                  clearInterval(timer);
                  if (event.data.type === "vis_pick_markdown_file") doMarkdownPickerInvoke();
                  else if (event.data.type === "vis_pick_directory") doDirectoryPickerInvoke();
                  else if (event.data.type === "vis_get_clipboard") doClipboardInvoke();
                  else doSimpleInvoke().catch(function () {});
                } else if (--attempts <= 0) {
                  clearInterval(timer);
                  if (event.data.type === "vis_pick_markdown_file") {
                    reply({ type: "vis_pick_markdown_file_result", requestId: event.data.requestId || "", error: "本地桥接未就绪", path: "" });
                  } else if (event.data.type === "vis_pick_directory") {
                    reply({ type: "vis_pick_directory_result", requestId: event.data.requestId || "", error: "本地桥接未就绪", path: "" });
                  } else {
                    reply({ type: "vis_clipboard_result", error: "本地桥接未就绪", paths: [] });
                  }
                }
              }, 100);
            }
          });
        }

        function getStoredTheme() {
          try {
            var t = window.localStorage ? localStorage.getItem("visionox-theme") : "";
            if (t && /^(light|dark|warm-sand|cool-ash|soft-sage|espresso|midnight-ink|deep-charcoal|indigo-night)$/.test(t)) return t;
          } catch (e) {}
          return "";
        }

        function applyThemeToUrl(url, theme) {
          url = url.replace(/([?&])theme=[^&]*/g, "$1").replace(/[?&]$/g, "").replace(/\?&/g, "?");
          if (theme) {
            url += (url.indexOf("?") === -1 ? "?" : "&") + "theme=" + encodeURIComponent(theme);
          }
          return url;
        }

        var pendingOpenArgs = null;
        function attachOpenArgsForwarding(frame) {
          if (!frame || frame.__visionoxOpenArgsForwarding) return;
          frame.__visionoxOpenArgsForwarding = true;
          frame.addEventListener("load", function () {
            resendPendingOpenArgs();
          });
        }

        function rememberOpenArgs(args, cwd) {
          pendingOpenArgs = { args: Array.isArray(args) ? args : [], cwd: cwd || "" };
          forwardArgsToDashboard(pendingOpenArgs.args, pendingOpenArgs.cwd);
        }

        function resendPendingOpenArgs() {
          if (!pendingOpenArgs) return;
          setTimeout(function () {
            forwardArgsToDashboard(pendingOpenArgs.args, pendingOpenArgs.cwd);
          }, 50);
        }

        function armDashboardReadyGuard(frame, spinner) {
          if (!frame) return;
          clearStartupStatusTimers();
          frame.dataset.ready = "";
          frame.style.visibility = "hidden";
          frame.style.opacity = "0";
          if (spinner) spinner.style.display = "";
          setStage(3, "正在加载界面");
          if (dashboardReadyTimer) clearTimeout(dashboardReadyTimer);
          dashboardReadyTimer = setTimeout(function () {
            if (frame.dataset.ready === "1") return;
            startupLog("dashboard did not report ready within 12 seconds");
            frame.style.visibility = "hidden";
            showDiagnostics("界面加载超时，请查看运行日志后重试。");
          }, 12000);
        }

        function finishDashboardReady(frame) {
          if (!frame) return;
          clearStartupStatusTimers();
          if (dashboardUrlPollTimer) {
            clearTimeout(dashboardUrlPollTimer);
            dashboardUrlPollTimer = null;
          }
          frame.dataset.ready = "1";
          frame.dataset.loaded = "1";
          frame.style.visibility = "visible";
          frame.style.opacity = "1";
          setStage(4, "");
          if (dashboardReadyTimer) {
            clearTimeout(dashboardReadyTimer);
            dashboardReadyTimer = null;
          }
          var spinner = document.querySelector(".wrap");
          if (spinner) {
            spinner.classList.add("is-done");
            setTimeout(function () {
              spinner.style.display = "none";
            }, 200);
          }
          startupLog("dashboard reported ready");
          // Splash is done: expand to the full window and restore the native
          // titlebar in the same transition frame as the content cross-fade.
          invokeTauriCommand("finish_startup_window", {}, 3).catch(function (err) {
            startupLog("finish_startup_window failed: " + String(err && err.message || err));
          });
          resendPendingOpenArgs();
        }

        function restoreDashboard() {
          var url = sessionStorage.getItem("visionox.dashboardUrl") || "";
          if (!/^http:\/\/127\.0\.0\.1:\d+\//.test(url)) {
            startupLog("restoreDashboard skipped: no current-session dashboard url");
            return;
          }
          if (dashboardUrlPollTimer) {
            clearTimeout(dashboardUrlPollTimer);
            dashboardUrlPollTimer = null;
          }
          startupLog("restoreDashboard using stored dashboard url");
          setStage(2, "正在恢复工作区");
          url = applyThemeToUrl(url, getStoredTheme());
          var frame = document.getElementById("vis-app-frame");
          var spinner = document.querySelector(".wrap");
          var isFreshFrame = false;
          if (!frame) {
            frame = document.createElement("iframe");
            frame.id = "vis-app-frame";
            frame.style.position = "fixed";
            frame.style.top = "0";
            frame.style.left = "0";
            frame.style.width = "100%";
            frame.style.height = "100%";
            frame.style.border = "none";
            frame.style.visibility = "hidden";
            frame.style.opacity = "0";
            document.body.appendChild(frame);
            isFreshFrame = true;
          }
          attachOpenArgsForwarding(frame);
          var navigationChanged = frame.src !== url;
          if (navigationChanged) frame.src = url;
          if (isFreshFrame) {
            frame.addEventListener("error", function () { fallbackToRust(); });
            frame.addEventListener("load", function () {
              frame.dataset.loaded = "1";
              startupLog("dashboard iframe loaded");
            });
          }
          if (navigationChanged || frame.dataset.ready !== "1") armDashboardReadyGuard(frame, spinner);
          else finishDashboardReady(frame);
        }

        function fallbackToRust() {
          if (window.__visionoxRustFallbackDone) return;
          window.__visionoxRustFallbackDone = true;
          startupLog("fallbackToRust invoked");
          try {
            sessionStorage.removeItem("visionox.dashboardUrl");
            sessionStorage.removeItem("visionox.dashboardOrigin");
            localStorage.removeItem("visionox.dashboardUrl");
            localStorage.removeItem("visionox.dashboardOrigin");
          } catch (e) {}
          var oldFrame = document.getElementById("vis-app-frame");
          if (oldFrame) { try { oldFrame.parentNode.removeChild(oldFrame); } catch (e) {} }
          var spinner = document.querySelector(".wrap");
          if (spinner) {
            spinner.style.display = "";
            spinner.classList.remove("is-done");
          }
          setStage(1, "正在重新连接本地服务");
          restoreFromRustAndShow();
        }

        installTauriBridge();
        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || !["vis_theme_changed", "vis_dashboard_ready"].includes(data.type)) return;
          var frame = document.getElementById("vis-app-frame");
          var dashboardOrigin = sessionStorage.getItem("visionox.dashboardOrigin") || localStorage.getItem("visionox.dashboardOrigin") || "";
          if (!frame || event.source !== frame.contentWindow || event.origin !== dashboardOrigin) return;
          if (data.type === "vis_dashboard_ready") {
            finishDashboardReady(frame);
            return;
          }
          try {
            localStorage.setItem("visionox-theme", String(data.theme || ""));
          } catch (e) {}
          // Persist for the next cold start so Rust can paint the splash
          // window in the theme background before any JavaScript runs.
          invokeTauriCommand("save_startup_theme", { theme: String(data.theme || "") }, 3).catch(function () {});
          try {
            document.documentElement.setAttribute("data-theme", String(data.theme || "light"));
          } catch (e) {}
          try {
            var currentUrl = sessionStorage.getItem("visionox.dashboardUrl") || localStorage.getItem("visionox.dashboardUrl") || "";
            if (currentUrl) {
              sessionStorage.setItem("visionox.dashboardUrl", applyThemeToUrl(currentUrl, data.theme));
            }
          } catch (e) {}
        });
        function forwardArgsToDashboard(args, cwd) {
          var frame = document.getElementById("vis-app-frame");
          var dashboardOrigin = sessionStorage.getItem("visionox.dashboardOrigin") || localStorage.getItem("visionox.dashboardOrigin") || "";
          if (!frame || !dashboardOrigin) return;
          try {
            frame.contentWindow.postMessage({ type: "vis_open_args", args: args, cwd: cwd }, dashboardOrigin);
          } catch (e) {}
        }

        if (getTauriInvoke() && window.__TAURI__.event && window.__TAURI__.event.listen) {
          window.__TAURI__.event.listen("visionox-startup-args", function (event) {
            if (event && event.payload) {
              rememberOpenArgs(event.payload.args || [], event.payload.cwd || "");
            }
          });
          invokeTauriCommand("get_startup_args", {}, 1)
            .then(function (res) {
              if (res && res.args && res.args.length > 1) {
                rememberOpenArgs(res.args, res.cwd || "");
              }
            })
            .catch(function () {});
        }

        function waitForTauri(cb, attemptsLeft) {
          attemptsLeft = attemptsLeft || 50;
          if (getTauriInvoke()) {
            cb();
            return;
          }
          if (attemptsLeft <= 0) {
            showDiagnostics("本地桥接未就绪，请查看运行日志后重试。");
            return;
          }
          setTimeout(function () { waitForTauri(cb, attemptsLeft - 1); }, 100);
        }

        function restoreFromRustAndShow(attempt) {
          attempt = Number.isFinite(attempt) ? attempt : 0;
          waitForTauri(function () {
            invokeTauriCommand("get_dashboard_url", {}, 1)
              .then(function (url) {
                if (url && /^http:\/\/127\.0\.0\.1:\d+\//.test(url)) {
                  startupLog("get_dashboard_url returned valid url");
                  try { sessionStorage.setItem("visionox.dashboardUrl", url); } catch (e) {}
                  try { localStorage.setItem("visionox.dashboardUrl", url); } catch (e) {}
                  var originMatch = url.match(/^http:\/\/127\.0\.0\.1:\d+/);
                  if (originMatch) {
                    try { sessionStorage.setItem("visionox.dashboardOrigin", originMatch[0]); } catch (e) {}
                    try { localStorage.setItem("visionox.dashboardOrigin", originMatch[0]); } catch (e) {}
                  }
                  restoreDashboard();
                } else {
                  if (attempt === 0) startupLog("get_dashboard_url is not ready; waiting for current server");
                  if (attempt >= 199) {
                    showDiagnostics("本地服务启动超时，请查看运行日志后重试。");
                    return;
                  }
                  dashboardUrlPollTimer = setTimeout(function () {
                    dashboardUrlPollTimer = null;
                    restoreFromRustAndShow(attempt + 1);
                  }, 150);
                }
              })
              .catch(function (err) {
                if (attempt === 0) startupLog("get_dashboard_url failed: " + String(err && err.message || err));
                if (attempt >= 199) {
                  showDiagnostics("无法连接本地服务，请查看运行日志后重试。");
                  return;
                }
                dashboardUrlPollTimer = setTimeout(function () {
                  dashboardUrlPollTimer = null;
                  restoreFromRustAndShow(attempt + 1);
                }, 150);
              });
          });
        }

        scheduleStartupStatus();
        setStage(1, "正在启动…");
        var hasStoredUrl = sessionStorage.getItem("visionox.dashboardUrl");
        if (hasStoredUrl) {
          restoreDashboard();
        } else {
          restoreFromRustAndShow();
        }
        window.__visionoxRestoreDashboard = restoreDashboard;
      })();
    </script>
  </body>
</html>
